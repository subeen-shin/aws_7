<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Document</title>

<style>
	body{
    background:#f3f4f8;
    font-family:맑은고딕;
}

.container{
    width:550px;
    margin:40px auto;
}

h1{
    text-align:center;}

form{
    display:flex;
    gap:10px;}

textarea{

    flex:1;
    height:100px;

    padding:15px;

    resize:none;

    border-radius:8px;

    border:1px solid #ddd;

}

.btn1{

    width:70px;

    background:#2f6cf4;

    color:white;

    border:none;

    border-radius:8px;

    cursor:pointer;

}

.memo{

    margin-top:15px;

    padding:15px;

    background:white;

    border-radius:10px;

    display:flex;
    justify-content:space-between;

    align-items:center;

    box-shadow:0 2px 8px rgba(0,0,0,.08);

     height:100px;


}

.delete{

    color:gray;

    cursor:pointer;

}

table{
   box-shadow: 0 0 15px gray; width: 550px; margin-top: 5px;
   border-radius: 10px;
}
.btn2{
    margin-left: auto;
    border: none;
    background: none;
    color: #999;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="container" id="memoList">

    <h1>메모패드 📝</h1>

    <form id="memoForm">

        <textarea
            id="memo"
            placeholder="메모를 입력하세요..."
        ></textarea>

        <button type="submit" class="btn1">추가</button>

    </form>

     <table class="table">
		<thead>
	
		</thead>
	 </table>

</div>

<script>
		let posts = [];


const form = document.querySelector('#memoForm');

form.addEventListener('submit', function(e){

    e.preventDefault();

    const writerEl = document.querySelector('#memo');
    let writer = writerEl.value;

    let post = {
    num: posts.length + 1,
    writer: writer
    };

    insertPostToTable(post);

    posts.push(post);

    localStorage.setItem('posts', JSON.stringify(posts));

    writerEl.value = "";
});
function insertPostToTable(post){

    const tbodyEl = document.querySelector('.table thead');

    let str = `
        <tr>
            <td>${post.writer}</td>
            <td>
                <button class="btn2" onclick="deletePost(${post.num})">
                    삭제
                </button>
            </td>
        </tr>
    `;

    tbodyEl.innerHTML += str;
}
		// 화면이 로딩되면 로컬 스토리지에 있는 게시글 목록을 가져와서 화면에 출력
		document.addEventListener('DOMContentLoaded', function(){

				//로컬 저장소에서 게시글 목록을 가져옴
				posts = JSON.parse (localStorage.getItem('posts'));
				
				// 저장된 게시글 목록이 없으면
				if(!posts){
					posts = [];
				}
				// 가져온 게시글 목록을 반복문으로 화면에 출력
				for(i = 0 ; i < posts.length; ++i){
					let post = posts[i];
					insertPostToTable(post);
				}
		});
        function deletePost(num){

    // 배열에서 삭제
    posts = posts.filter(post => post.num !== num);

    // 로컬스토리지 갱신
    localStorage.setItem('posts', JSON.stringify(posts));

    // 화면 다시 그리기
    const tbodyEl = document.querySelector('.table thead');
    tbodyEl.innerHTML = "";

    posts.forEach(post => {
        insertPostToTable(post);
    });
}
	 </script>


</body>
</html>
